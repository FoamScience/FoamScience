  <title id="title">FoamScience</title>
  <desc id="desc">Mohammed Elwardi Fadeli builds tooling around OpenFOAM: adaptive mesh refinement with blastAMR, editor support for case dictionaries with foam-language-server, and multi-objective Bayesian optimization with foamBO.</desc>
